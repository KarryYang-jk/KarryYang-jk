<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">KarryYang-jk cyber terminal banner</title>
  <desc id="desc">A dark cyber terminal banner with a grid, system labels, and a code HUD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070b" />
      <stop offset="0.58" stop-color="#07131a" />
      <stop offset="1" stop-color="#081c20" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="0.52" stop-color="#00e5ff" stop-opacity="0.72" />
      <stop offset="1" stop-color="#89ffb8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#76ff9f" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#61e8ff" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="1184" height="344" rx="24" />
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 982px 181px; }
      @keyframes scan { 0%, 12% { transform: translateY(-80px); opacity: 0; } 28% { opacity: .7; } 75% { opacity: .2; } 100% { transform: translateY(430px); opacity: 0; } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { transform: scale(.92); opacity: .35; } 50% { transform: scale(1.08); opacity: .8; } }
      @media (prefers-reduced-motion: reduce) { .scan, .cursor, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="344" rx="24" fill="url(#bg)" />
    <rect x="8" y="8" width="1184" height="344" fill="url(#grid)" />
    <path d="M0 295L480 95L720 165L1220 42V360H0Z" fill="#00e5ff" opacity="0.025" />
    <path d="M-80 295L450 75L735 158L1280 24" fill="none" stroke="url(#beam)" stroke-width="2" opacity="0.52" />

    <g class="mono">
      <text x="62" y="58" fill="#76ff9f" font-size="13" letter-spacing="2.2">KARRY/YANG :: PROFILE_NODE</text>
      <text x="1022" y="58" fill="#68838b" font-size="11" text-anchor="end">SESSION 0x4B</text>
      <circle cx="1044" cy="54" r="4" fill="#76ff9f" filter="url(#glow)" />
      <text x="1060" y="58" fill="#b9d1d5" font-size="11">ONLINE</text>

      <text x="62" y="159" fill="#ecfeff" font-size="50" font-weight="700" letter-spacing="1">KarryYang-jk</text>
      <rect class="cursor" x="440" y="119" width="12" height="48" rx="1" fill="#00e5ff" />
      <text x="66" y="202" fill="#8aa8ae" font-size="15" letter-spacing="2.8">MOBILE · CROSS-PLATFORM · WEB</text>

      <rect x="62" y="243" width="430" height="46" rx="6" fill="#061117" stroke="#183943" />
      <text x="82" y="272" fill="#00e5ff" font-size="14">$</text>
      <text x="104" y="272" fill="#d2e8eb" font-size="14">build --learn --iterate</text>
      <text x="362" y="272" fill="#76ff9f" font-size="14">[READY]</text>
    </g>

    <g transform="translate(982 181)" fill="none">
      <circle class="pulse" cx="0" cy="0" r="108" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="0" cy="0" r="82" stroke="#214b54" stroke-width="1" stroke-dasharray="4 8" />
      <circle cx="0" cy="0" r="57" stroke="#76ff9f" stroke-opacity="0.32" />
      <path d="M-112 0H112M0-112V112" stroke="#2a5b65" stroke-opacity="0.55" />
      <path d="M-58-58L58 58M58-58L-58 58" stroke="#16363e" />
      <circle cx="0" cy="0" r="9" fill="#76ff9f" fill-opacity="0.18" stroke="#76ff9f" filter="url(#glow)" />
      <circle cx="64" cy="-52" r="4" fill="#00e5ff" stroke="none" />
      <circle cx="-42" cy="70" r="4" fill="#76ff9f" stroke="none" />
      <path d="M64-52L0 0L-42 70" stroke="url(#accent)" stroke-opacity="0.7" />
    </g>
    <text class="mono" x="982" y="188" fill="#ecfeff" font-size="28" font-weight="700" text-anchor="middle">&lt;/&gt;</text>

    <rect class="scan" x="8" y="-56" width="1184" height="54" fill="url(#beam)" opacity="0.38" />
  </g>

  <rect x="8.5" y="8.5" width="1183" height="343" rx="23.5" fill="none" stroke="#2b606a" />
  <path d="M34 8.5H164M1036 351.5H1166" stroke="url(#accent)" stroke-width="2" />
</svg>
