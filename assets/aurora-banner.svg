<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">KarryYang-jk animated aurora banner</title>
  <desc id="desc">A dark animated aurora with floating stars and a personal greeting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816" />
      <stop offset="0.5" stop-color="#0b1024" />
      <stop offset="1" stop-color="#130b2b" />
    </linearGradient>
    <linearGradient id="aurora-one" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="0.7" stop-color="#8b5cf6" stop-opacity="0.72" />
      <stop offset="1" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aurora-two" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="0.45" stop-color="#6366f1" stop-opacity="0.62" />
      <stop offset="0.8" stop-color="#a855f7" stop-opacity="0.52" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-large" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <clipPath id="rounded-frame">
      <rect x="8" y="8" width="1184" height="344" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-frame)">
    <rect x="8" y="8" width="1184" height="344" rx="28" fill="url(#background)" />
    <ellipse cx="600" cy="180" rx="460" ry="210" fill="url(#glow)">
      <animate attributeName="rx" values="420;500;420" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite" />
    </ellipse>

    <path fill="url(#aurora-one)" filter="url(#blur-large)" opacity="0.82"
      d="M-100 250 C120 80 300 290 520 125 C730 -30 870 205 1300 30 L1300 245 C960 340 760 130 525 285 C280 430 100 235 -100 370 Z">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M-100 250 C120 80 300 290 520 125 C730 -30 870 205 1300 30 L1300 245 C960 340 760 130 525 285 C280 430 100 235 -100 370 Z;
                M-100 205 C130 300 330 40 555 185 C765 320 960 20 1300 145 L1300 300 C970 205 760 385 530 235 C300 85 115 345 -100 275 Z;
                M-100 250 C120 80 300 290 520 125 C730 -30 870 205 1300 30 L1300 245 C960 340 760 130 525 285 C280 430 100 235 -100 370 Z" />
    </path>

    <path fill="url(#aurora-two)" filter="url(#blur-large)" opacity="0.65"
      d="M-80 70 C170 210 360 -15 610 135 C810 250 1015 70 1280 190 L1280 360 L-80 360 Z">
      <animate attributeName="d" dur="15s" repeatCount="indefinite"
        values="M-80 70 C170 210 360 -15 610 135 C810 250 1015 70 1280 190 L1280 360 L-80 360 Z;
                M-80 165 C155 20 385 255 620 90 C870 -60 1040 230 1280 95 L1280 360 L-80 360 Z;
                M-80 70 C170 210 360 -15 610 135 C810 250 1015 70 1280 190 L1280 360 L-80 360 Z" />
    </path>

    <g fill="#ffffff">
      <circle cx="105" cy="74" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite" /></circle>
      <circle cx="225" cy="125" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.1s" repeatCount="indefinite" /></circle>
      <circle cx="347" cy="66" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite" /></circle>
      <circle cx="870" cy="88" r="1.8" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.8s" repeatCount="indefinite" /></circle>
      <circle cx="1015" cy="145" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite" /></circle>
      <circle cx="1110" cy="62" r="2" opacity="0.5"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.4s" repeatCount="indefinite" /></circle>
      <circle cx="960" cy="285" r="1" opacity="0.55"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite" /></circle>
      <circle cx="175" cy="278" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.2s" repeatCount="indefinite" /></circle>
    </g>

    <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
      <text x="360" y="174" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="1">
        KarryYang-jk
      </text>
      <text x="390" y="218" fill="#d8d7ff" font-size="14" font-weight="500" letter-spacing="3.5">
        STAY CURIOUS · KEEP CREATING
      </text>
    </g>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="343" rx="27.5" fill="none" stroke="#a78bfa" stroke-opacity="0.22" />
</svg>
