<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">KarryYang-jk technology console</title>
  <desc id="desc">A terminal panel listing Flutter, Android, Kotlin, Java, and H5.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071017" />
      <stop offset="1" stop-color="#0a171b" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#76ff9f" />
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node { animation: breathe 2.8s ease-in-out infinite; }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes breathe { 0%, 100% { opacity: .38; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .node { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#panel)" stroke="#23414a" stroke-width="2" />
  <path d="M1 52H1199" stroke="#213a42" />
  <circle cx="29" cy="27" r="5" fill="#ff5f57" />
  <circle cx="47" cy="27" r="5" fill="#febc2e" />
  <circle cx="65" cy="27" r="5" fill="#28c840" />
  <text class="mono" x="600" y="32" text-anchor="middle" fill="#6f8d93" font-size="12" letter-spacing="1.5">karry@github: ~/stack</text>

  <g class="mono">
    <text x="42" y="91" fill="#76ff9f" font-size="15">karry@github</text>
    <text x="158" y="91" fill="#7f9da3" font-size="15">:</text>
    <text x="170" y="91" fill="#00e5ff" font-size="15">~/stack</text>
    <text x="242" y="91" fill="#d7eef1" font-size="15">$ inspect --available</text>

    <text x="42" y="132" fill="#67848a" font-size="13">RUNTIME</text>
    <text x="140" y="132" fill="#d7eef1" font-size="14">mobile / jvm / web</text>
    <text x="42" y="165" fill="#67848a" font-size="13">MODE</text>
    <text x="140" y="165" fill="#d7eef1" font-size="14">build · learn · iterate</text>
    <text x="42" y="198" fill="#67848a" font-size="13">OUTPUT</text>
    <text x="140" y="198" fill="#76ff9f" font-size="14">ideas → working code</text>
    <text x="42" y="246" fill="#00e5ff" font-size="15">›</text>
    <text x="65" y="246" fill="#d7eef1" font-size="14">await nextExperiment()</text>
    <rect class="cursor" x="260" y="230" width="9" height="20" fill="#76ff9f" />
  </g>

  <path d="M565 77V256" stroke="#203940" />

  <g class="mono">
    <text x="610" y="91" fill="#67848a" font-size="12" letter-spacing="2">AVAILABLE MODULES</text>

    <g transform="translate(610 116)">
      <circle class="node" cx="7" cy="7" r="7" fill="#00e5ff" filter="url(#soft-glow)" />
      <text x="29" y="12" fill="#e7fbff" font-size="16" font-weight="700">FLUTTER</text>
      <text x="172" y="12" fill="#5f7f85" font-size="12">CROSS-PLATFORM</text>
      <path d="M0 31H458" stroke="#17343c" />
    </g>

    <g transform="translate(610 161)">
      <circle cx="7" cy="7" r="7" fill="#76ff9f" />
      <text x="29" y="12" fill="#e7fbff" font-size="16" font-weight="700">ANDROID</text>
      <text x="172" y="12" fill="#5f7f85" font-size="12">NATIVE MOBILE</text>
      <path d="M0 31H458" stroke="#17343c" />
    </g>

    <g transform="translate(610 206)">
      <circle cx="7" cy="7" r="7" fill="#ffb86c" />
      <text x="29" y="12" fill="#e7fbff" font-size="16" font-weight="700">KOTLIN · JAVA · H5</text>
      <text x="292" y="12" fill="#5f7f85" font-size="12">LANGUAGES</text>
      <path d="M0 31H458" stroke="#17343c" />
    </g>

    <rect x="1034" y="73" width="94" height="30" rx="15" fill="#0d2823" stroke="#2d7557" />
    <text x="1081" y="93" text-anchor="middle" fill="#76ff9f" font-size="11">READY</text>
  </g>

  <path d="M1128 271H1065" stroke="url(#line)" stroke-width="2" />
  <circle cx="1137" cy="271" r="4" fill="#76ff9f" />
</svg>
