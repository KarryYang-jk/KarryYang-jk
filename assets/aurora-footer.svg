<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Animated cyber terminal footer">
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="0.25" stop-color="#00e5ff" />
      <stop offset="0.75" stop-color="#76ff9f" />
      <stop offset="1" stop-color="#76ff9f" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
